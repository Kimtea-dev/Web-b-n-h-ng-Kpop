<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title></title>
        <link rel="stylesheet" href="admin.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>

    <body>
        <div class="admin-layout">
            <div class="sidebar">
                <p class="shop-name"><strong>Tên shop</strong></p><br>
                <div>
                    <button class="btn"><i class="bi bi-clipboard-data"></i> Dashboard</button>
                    <button class="btn"><i class="bi bi-box-seam"></i> Sản phẩm</button>
                    <button class="btn"><i class="bi bi-bag-check"></i> Đơn hàng</button>
                    <button class="btn"><i class="bi bi-people"></i> Khách hàng</button>
                    <button class="btn"><i class="bi bi-graph-up"></i> Báo cáo</button>
                </div>
            </div>

            <div class="admin_page">
                <div class="page-header">
                    <div class="page-description">
                        <p class="breadcrumb">Trang chủ/...</p>
                        <p class="page-title"><strong>Tiêu đề trang</strong></p>
                        <p class="page-subtitle">Phụ đề</p>
                    </div>

                    <div class="admin-profile">
                        <img class="admin-avatar" src="Admin-picture.png">
                        <div class="admin-info">
                            <span class="admin-name"><strong>Admin</strong></span>
                            <span class="admin-role">Quản trị viên</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
