<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-POP STORE - ADMIN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin-forms.css">
  <link rel="stylesheet" href="../css/admin-auth.css">
</head>

<body class="admin-login-page">
  <main class="admin-login-card">
    <p class="shop-name" style="color:#4F46E5;"><strong>K-POP STORE</strong></p>
    <h1 style="color:#4F46E5;">Đăng nhập quản trị</h1>
    <form novalidate onsubmit="window.location.href='dashboard.html'; return false;">
      <div class="form-group">
        <label for="adminEmail">Email quản trị</label>
        <input id="adminEmail" type="email" placeholder="admin@example.com">
      </div>
      <div class="form-group">
        <label for="adminPassword">Mật khẩu</label>
        <input id="adminPassword" type="password" placeholder="Nhập mật khẩu">
      </div>
      <button type="submit" class="btn btn-primary" style="background:#4F46E5; margin-top: 45xp;">Đăng nhập</button>
    </form>
    <a class="admin-login-link" href="../index.html" style="color:#4F46E5; margin-top: 30px;">Quay lại Trang mua sắm</a>
  </main>
  <script src="../js/admin-notifications.js"></script>
</body>

</html>
