<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập quản trị - K-POP STORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin-forms.css">
  <link rel="stylesheet" href="../css/admin-auth.css">
</head>

<body class="admin-login-page">
  <main class="admin-login-card">
    <p class="shop-name"><strong>K-POP STORE</strong></p>
    <h1>Đăng nhập quản trị</h1>
    <form novalidate onsubmit="window.location.href='dashboard.html'; return false;">
      <div class="form-group">
        <label for="adminEmail">Email quản trị</label>
        <input id="adminEmail" type="email" placeholder="admin@example.com">
      </div>
      <div class="form-group">
        <label for="adminPassword">Mật khẩu</label>
        <input id="adminPassword" type="password" placeholder="Nhập mật khẩu">
      </div>
      <button type="submit" class="btn btn-primary">Đăng nhập</button>
    </form>
    <a class="admin-login-link" href="dashboard.html">Quay lại Dashboard</a>
  </main>
</body>

</html>
